<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage — Your limits. At a glance.</title>
  <desc id="desc">A dark lavender banner with two abstract progress bars representing the compact macOS menu bar indicator.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171420"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8f75d8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8f75d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent">
      <stop stop-color="#c2a8fa"/>
      <stop offset="1" stop-color="#97aad9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1118" height="338" rx="26" fill="url(#background)" stroke="#34303f"/>
  <ellipse cx="885" cy="166" rx="265" ry="195" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="52" y="40" width="8" height="8" rx="4" fill="#bba0f1"/>
    <text x="74" y="51" fill="#c2b6da" font-size="16" font-weight="600" letter-spacing="2">CODEX USAGE / MACOS</text>
    <text x="50" y="132" fill="#f5f3fb" font-size="62" font-weight="650" letter-spacing="-2">Your limits.</text>
    <text x="50" y="198" fill="#bda7ed" font-size="62" font-weight="650" letter-spacing="-2">At a glance.</text>
    <text x="53" y="244" fill="#aaa3b8" font-size="19">Remaining allowance. Reset times. 5-hour usage.</text>
    <path d="M53 278h595" stroke="#34303f"/>
    <text x="53" y="307" fill="#c9c4d4" font-size="15">NATIVE MACOS</text>
    <circle cx="203" cy="301" r="2" fill="#786d8b"/>
    <text x="223" y="307" fill="#c9c4d4" font-size="15">SWIFTUI + APPKIT</text>
    <circle cx="395" cy="301" r="2" fill="#786d8b"/>
    <text x="415" y="307" fill="#c9c4d4" font-size="15">NO NPM DEPENDENCIES</text>
    <rect x="747" y="50" width="304" height="224" rx="24" fill="#1c1925" stroke="#484052"/>
    <path d="M769 94h260" stroke="#393341"/>
    <circle cx="773" cy="73" r="4" fill="#787084"/>
    <circle cx="789" cy="73" r="4" fill="#635b70"/>
    <circle cx="805" cy="73" r="4" fill="#4f485b"/>
    <text x="777" y="127" fill="#c0b6ce" font-size="13" font-weight="600" letter-spacing="1.2">SHORT-TERM</text>
    <rect x="777" y="143" width="244" height="8" rx="4" fill="#383140"/>
    <rect x="777" y="143" width="214" height="8" rx="4" fill="url(#accent)"/>
    <text x="777" y="193" fill="#c0b6ce" font-size="13" font-weight="600" letter-spacing="1.2">WEEKLY</text>
    <rect x="777" y="209" width="244" height="8" rx="4" fill="#383140"/>
    <rect x="777" y="209" width="142" height="8" rx="4" fill="#9eadd3"/>
    <circle cx="778" cy="244" r="3" fill="#98c7ae"/>
    <text x="790" y="249" fill="#b1a9bd" font-size="13">A quiet place in your menu bar</text>
  </g>
</svg>
